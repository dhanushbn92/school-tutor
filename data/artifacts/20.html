<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exploring Magnets in the Solar System</title>
<style>
  :root { --bg:#050711; --panel:rgba(15,20,35,0.82); --border:rgba(255,255,255,0.12); --text:#e8ecf5; --muted:#9aa3b2; --accent:#60a5fa; }
  html,body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #scene { position:fixed; inset:0; }
  .overlay { position:fixed; z-index:2; pointer-events:none; }
  .overlay > * { pointer-events:auto; }
  #header { top:16px; left:16px; right:16px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .panel { background:var(--panel); backdrop-filter: blur(12px); border:1px solid var(--border); border-radius:12px; padding:14px 16px; max-width:420px; }
  h1 { margin:0; font-size:18px; font-weight:600; letter-spacing:-0.2px; }
  p.sub { margin:4px 0 0; font-size:13px; color:var(--muted); }
  #controls { bottom:20px; left:16px; right:16px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .pill { display:inline-flex; align-items:center; gap:10px; background:var(--panel); backdrop-filter: blur(12px); border:1px solid var(--border); border-radius:999px; padding:8px 14px; font-size:13px; }
  button { background:transparent; color:var(--text); border:1px solid var(--border); border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  input[type=range] { width:120px; accent-color: var(--accent); }
  #info { top:84px; right:16px; width:320px; max-height:calc(100vh - 200px); overflow:auto; display:none; }
  #info.open { display:block; }
  #info h2 { margin:0 0 4px; font-size:16px; }
  #info .kind { display:inline-block; padding:2px 10px; font-size:11px; letter-spacing:.5px; text-transform:uppercase; background:rgba(96,165,250,.15); color:var(--accent); border-radius:999px; margin-bottom:8px; }
  #info p { margin:8px 0; font-size:13px; line-height:1.5; color:#dbe1ec; }
  #info .fact { margin-top:10px; padding:10px; background:rgba(96,165,250,.08); border-left:3px solid var(--accent); border-radius:6px; font-size:12px; color:var(--muted); font-style:italic; }
  .hint { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); color:var(--muted); font-size:12px; pointer-events:none; z-index:1; }
</style>
</head>
<body>
<div id="scene"></div>

<div class="overlay" id="header">
  <div class="panel">
    <h1>Exploring Magnets in the Solar System</h1>
    <p class="sub">Explore how magnets work in our solar system by interacting with the celestial bodies.</p>
  </div>
</div>

<div class="overlay panel" id="info" role="complementary" aria-live="polite">
  <span class="kind" id="info-kind">Planet</span>
  <h2 id="info-name">Name</h2>
  <p id="info-desc"></p>
  <div class="fact" id="info-fact"></div>
  <button id="info-close" style="margin-top:10px">Close</button>
</div>

<div class="overlay" id="controls">
  <span class="pill">
    Speed <input id="speed" type="range" min="0" max="3" step="0.05" value="1" />
    <span id="speed-val">1.0x</span>
  </span>
  <button id="reset-view">Reset view</button>
  <button id="toggle-orbits">Toggle orbits</button>
  <button id="toggle-labels">Toggle labels</button>
</div>

<div class="hint">Drag to rotate · Scroll to zoom · Click a body to learn more</div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.164.1",
    "three/addons/": "https://esm.sh/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

// ---- LLM-provided data ----
const BODIES = [{"name": "Sun", "kind": "STAR", "orbit_position": 0, "description": "The Sun is the center of our solar system and does not have a magnetic pole like Earth.", "fun_fact": "The Sun's magnetic field is much stronger than Earth's and plays a crucial role in the solar system."}, {"name": "Earth", "kind": "PLANET", "orbit_position": 1, "description": "Earth is a magnet with a North and South pole, and its magnetic field protects us from harm.", "fun_fact": "Earth's magnetic field is what makes compasses work, helping us navigate."}, {"name": "Magnetic Asteroid", "kind": "ASTEROID", "orbit_position": 2, "description": "Some asteroids are made of magnetic materials and can be attracted to magnets.", "fun_fact": "Asteroids with magnetic properties can provide valuable insights into the early formation of our solar system."}, {"name": "Jupiter's Magnetosphere", "kind": "PLANET", "orbit_position": 3, "description": "Jupiter has an incredibly strong magnetic field that traps charged particles from the solar wind.", "fun_fact": "Jupiter's magnetosphere is so strong that it can even trap and hold onto some of Saturn's moons."}];

// Known-body visual presets. Unknown names fall back to defaults.
const PRESETS = {
  sun:     { color:0xffc36b, emissive:0xffaa33, radius:2.6 },
  mercury: { color:0xb1b1b1, radius:0.38 },
  venus:   { color:0xe8c07d, radius:0.52 },
  earth:   { color:0x3b82f6, radius:0.55 },
  moon:    { color:0xcccccc, radius:0.18 },
  mars:    { color:0xd1603c, radius:0.47 },
  jupiter: { color:0xd5a878, radius:1.4 },
  saturn:  { color:0xe0bd7b, radius:1.2, ring:true },
  uranus:  { color:0x7dd3c0, radius:0.88 },
  neptune: { color:0x4f7ff9, radius:0.86 },
  pluto:   { color:0xc9b8a8, radius:0.22 },
};
function presetFor(name, kind) {
  const key = (name || "").toLowerCase().trim();
  if (PRESETS[key]) return PRESETS[key];
  if (kind === "STAR")   return { color:0xffd6a5, emissive:0xffaa33, radius:2.4 };
  if (kind === "MOON")   return { color:0xbfbfbf, radius:0.2 };
  if (kind === "ASTEROID") return { color:0x999084, radius:0.18 };
  if (kind === "DWARF_PLANET") return { color:0xc4a27a, radius:0.3 };
  // Generic planet fallback.
  return { color:0x8bb4f0, radius:0.6 };
}

// ---- three.js scene ----
const sceneEl = document.getElementById("scene");
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 14, 28);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
sceneEl.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = "absolute";
labelRenderer.domElement.style.top = "0";
labelRenderer.domElement.style.pointerEvents = "none";
sceneEl.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 120;

// Starfield background.
(function buildStars() {
  const g = new THREE.BufferGeometry();
  const count = 2500;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 600;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);
    positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = r * Math.cos(phi);
  }
  g.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const m = new THREE.PointsMaterial({ size:0.5, color:0xffffff, sizeAttenuation:false, opacity:0.7, transparent:true });
  scene.add(new THREE.Points(g, m));
})();

// Gentle ambient + point-at-star lighting set below once we know where the star is.
scene.add(new THREE.AmbientLight(0x606070, 1.0));

// Build the solar system from LLM data.
const sorted = [...BODIES].sort((a, b) => a.orbit_position - b.orbit_position);
const orbitCount = Math.max(1, sorted.filter(b => b.orbit_position > 0).length);
const orbitStep = 3.0;       // distance between orbits (units)
const orbitStart = 5.0;      // radius of innermost orbit
const orbitEnd = orbitStart + orbitStep * (orbitCount - 1);

const bodyObjects = [];      // { body, mesh, orbit, radius, speed, phase }
const orbitLines = [];
const labels = [];

sorted.forEach((body, index) => {
  const preset = presetFor(body.name, body.kind);
  if (body.kind === "STAR" || body.orbit_position === 0) {
    const geom = new THREE.SphereGeometry(preset.radius, 48, 48);
    const mat = new THREE.MeshStandardMaterial({
      color: preset.color,
      emissive: preset.emissive ?? 0xaa5500,
      emissiveIntensity: 1.3,
      roughness: 1,
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.userData.body = body;
    scene.add(mesh);

    const light = new THREE.PointLight(0xffddaa, 2.5, 0, 0.8);
    light.position.set(0, 0, 0);
    scene.add(light);

    attachLabel(mesh, body.name);
    bodyObjects.push({ body, mesh, orbit:0, radius:preset.radius, speed:0, phase:0 });
  } else {
    const orbitIndex = body.orbit_position - 1;
    const radius = orbitStart + orbitStep * orbitIndex;

    const geom = new THREE.SphereGeometry(preset.radius, 32, 32);
    const mat = new THREE.MeshStandardMaterial({
      color: preset.color,
      roughness: 0.75,
      metalness: 0.05,
    });
    const mesh = new THREE.Mesh(geom, mat);
    const phase = Math.random() * Math.PI * 2;
    mesh.position.set(radius * Math.cos(phase), 0, radius * Math.sin(phase));
    mesh.userData.body = body;
    scene.add(mesh);

    // Optional Saturn-style ring for Saturn or any explicit ring preset.
    if (preset.ring) {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(preset.radius * 1.4, preset.radius * 2.2, 48),
        new THREE.MeshBasicMaterial({ color: 0xe5d7b3, side: THREE.DoubleSide, transparent:true, opacity:0.6 }),
      );
      ring.rotation.x = -Math.PI / 2.5;
      mesh.add(ring);
    }

    // Circular orbit path.
    const curve = new THREE.EllipseCurve(0, 0, radius, radius, 0, Math.PI * 2, false, 0);
    const points = curve.getPoints(128).map(p => new THREE.Vector3(p.x, 0, p.y));
    const orbitLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(points),
      new THREE.LineBasicMaterial({ color: 0x314060, transparent:true, opacity:0.35 }),
    );
    scene.add(orbitLine);
    orbitLines.push(orbitLine);

    attachLabel(mesh, body.name);

    // Outer bodies orbit slower (rough Keplerian flavour).
    const baseSpeed = 0.35 / Math.sqrt(radius / orbitStart);
    bodyObjects.push({ body, mesh, orbit:radius, radius:preset.radius, speed:baseSpeed, phase });
  }

  void orbitEnd;
  void index;
});

function attachLabel(mesh, name) {
  const div = document.createElement("div");
  div.textContent = name;
  div.style.cssText = "color:#e8ecf5; font-size:12px; padding:2px 8px; background:rgba(10,14,25,0.6); border:1px solid rgba(255,255,255,0.15); border-radius:999px; letter-spacing:.2px; white-space:nowrap;";
  const label = new CSS2DObject(div);
  label.position.set(0, mesh.geometry.parameters.radius * 1.6 + 0.5, 0);
  mesh.add(label);
  labels.push(label);
}

// ---- Interactivity: click to open info panel ----
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const infoPanel = document.getElementById("info");
const infoName = document.getElementById("info-name");
const infoDesc = document.getElementById("info-desc");
const infoFact = document.getElementById("info-fact");
const infoKind = document.getElementById("info-kind");
document.getElementById("info-close").addEventListener("click", () => infoPanel.classList.remove("open"));

renderer.domElement.addEventListener("click", (event) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = bodyObjects.map(b => b.mesh);
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length === 0) return;
  const body = hits[0].object.userData.body;
  openInfo(body);
});

function openInfo(body) {
  infoName.textContent = body.name;
  infoDesc.textContent = body.description;
  infoFact.textContent = body.fun_fact ? "Did you know? " + body.fun_fact : "";
  infoKind.textContent = (body.kind || "planet").toLowerCase().replace("_", " ");
  infoPanel.classList.add("open");
}

// ---- Controls ----
let speedMultiplier = 1;
const speedSlider = document.getElementById("speed");
const speedVal = document.getElementById("speed-val");
speedSlider.addEventListener("input", (e) => {
  speedMultiplier = parseFloat(e.target.value);
  speedVal.textContent = speedMultiplier.toFixed(2) + "x";
});

let orbitsVisible = true;
document.getElementById("toggle-orbits").addEventListener("click", () => {
  orbitsVisible = !orbitsVisible;
  orbitLines.forEach(l => (l.visible = orbitsVisible));
});

let labelsVisible = true;
document.getElementById("toggle-labels").addEventListener("click", () => {
  labelsVisible = !labelsVisible;
  labels.forEach(l => (l.visible = labelsVisible));
});

document.getElementById("reset-view").addEventListener("click", () => {
  camera.position.set(0, 14, 28);
  controls.target.set(0, 0, 0);
});

// ---- Resize + animate ----
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  const dt = clock.getDelta();
  bodyObjects.forEach(b => {
    if (b.orbit === 0) {
      b.mesh.rotation.y += dt * 0.2 * speedMultiplier;
      return;
    }
    b.phase += b.speed * dt * speedMultiplier;
    b.mesh.position.set(b.orbit * Math.cos(b.phase), 0, b.orbit * Math.sin(b.phase));
    b.mesh.rotation.y += dt * 0.8 * speedMultiplier;
  });
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
