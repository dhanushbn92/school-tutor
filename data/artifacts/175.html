<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Match each word to its meaning</title>
<style>
  :root { --bg:#0b1020; --panel:rgba(15,20,35,0.88); --border:rgba(255,255,255,0.12); --text:#e8ecf5; --muted:#9aa3b2; --accent:#f472b6; --ok:#22c55e; --bad:#ef4444; }
  html,body { margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:24px; box-sizing:border-box; }
  header { max-width:920px; margin:0 auto 14px; display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; }
  h1 { margin:0; font-size:20px; font-weight:600; }
  p.sub { margin:4px 0 0; font-size:13px; color:var(--muted); line-height:1.5; flex-basis:100%; }
  .modes { display:flex; gap:8px; }
  .modes button { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; }
  .modes button.active { background:var(--accent); color:#0b1020; border-color:var(--accent); }

  /* ----- pairs mode ----- */
  #pairs-board { max-width:920px; margin:0 auto; display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:start; }
  .col { display:flex; flex-direction:column; gap:8px; }
  .col h2 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); }
  .pcard { padding:10px 14px; background:var(--panel); border:1px solid var(--border); border-radius:10px; font-size:14px; cursor:pointer; transition: border-color 100ms ease, background 100ms ease; }
  .pcard:hover { border-color:var(--accent); }
  .pcard.selected { border-color:var(--accent); background:rgba(244,114,182,0.18); }
  .pcard.matched { opacity:0.45; pointer-events:none; }
  .pcard.bad { border-color:var(--bad); background:rgba(239,68,68,0.15); }
  .play-btn { display:inline-block; margin-left:6px; padding:1px 7px; border:1px solid var(--border); border-radius:999px; font-size:11px; cursor:pointer; background:rgba(11,16,32,0.6); }
  .play-btn:hover { border-color:var(--accent); color:var(--accent); }
  .pmid { display:flex; flex-direction:column; align-items:center; padding-top:32px; gap:10px; color:var(--muted); font-size:12px; }
  svg.lines { position:absolute; pointer-events:none; }
  #pairs-wrap { position:relative; max-width:920px; margin:0 auto; }

  /* ----- memory mode ----- */
  #memory-board { max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  .mcard { aspect-ratio: 3 / 4; perspective: 800px; cursor:pointer; }
  .mcard .face { position:relative; width:100%; height:100%; transition: transform 350ms ease; transform-style: preserve-3d; }
  .mcard.flipped .face { transform: rotateY(180deg); }
  .mcard.matched .face { opacity:0.45; }
  .mcard .front, .mcard .back { position:absolute; inset:0; backface-visibility: hidden; display:flex; align-items:center; justify-content:center; padding:8px; border-radius:12px; border:1px solid var(--border); text-align:center; box-sizing:border-box; }
  .mcard .front { background:var(--panel); }
  .mcard .back { background:rgba(244,114,182,0.18); transform: rotateY(180deg); font-size:13px; }
  .mcard.bad .back { background:rgba(239,68,68,0.18); border-color:var(--bad); }
  .mcard img.thumb { max-width:100%; max-height:100%; border-radius:8px; }

  #score { max-width:920px; margin:14px auto 0; font-size:13px; color:var(--muted); }
  #score.ok { color:var(--ok); }
  #score.bad { color:var(--bad); }
  button.primary { background:var(--accent); color:#0b1020; border-color:var(--accent); font-weight:600; }
  #actions { max-width:920px; margin:14px auto 0; display:flex; gap:10px; }
  button { background:transparent; color:var(--text); border:1px solid var(--border); border-radius:999px; padding:8px 16px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Match each word to its meaning</h1>
    <p class="sub">Drag each word to its meaning, OR play in memory mode (cards face down) and try to find a matching pair. These are the key vocabulary words from &#x27;A Bottle of Dew&#x27;.</p>
  </div>
  <div class="modes">
    <button data-mode="pairs" id="m-pairs">Pairs</button>
    <button data-mode="memory" id="m-memory">Memory</button>
  </div>
</header>

<div id="pairs-wrap">
  <svg class="lines" id="lines" width="100%" height="100%"></svg>
  <div id="pairs-board">
    <div class="col"><h2>Term</h2><div id="col-terms"></div></div>
    <div class="pmid"><div>↔</div><div>match</div></div>
    <div class="col"><h2>Translation</h2><div id="col-translations"></div></div>
  </div>
</div>

<div id="memory-board" style="display:none"></div>

<div id="actions">
  <button id="reset">Shuffle / restart</button>
  <span id="score"></span>
</div>

<script>
  // CONFIG = { cards: [{term, translation, audio_url, image_url, note}], mode }
  const CONFIG = {"cards": [{"term": "precious", "translation": "of great value; treasured", "audio_url": null, "image_url": null, "note": null}, {"term": "thankful", "translation": "feeling or showing gratitude", "audio_url": null, "image_url": null, "note": null}, {"term": "delicately", "translation": "in a gentle, careful way", "audio_url": null, "image_url": null, "note": null}, {"term": "balanced", "translation": "held without falling", "audio_url": null, "image_url": null, "note": null}, {"term": "dew", "translation": "early-morning water drops on grass / leaves", "audio_url": null, "image_url": null, "note": null}, {"term": "courtyard", "translation": "open space inside or beside a building", "audio_url": null, "image_url": null, "note": null}, {"term": "gathered", "translation": "brought together in one place", "audio_url": null, "image_url": null, "note": null}, {"term": "grain", "translation": "a single small seed of rice or wheat", "audio_url": null, "image_url": null, "note": null}, {"term": "goldsmith", "translation": "a person who works with gold", "audio_url": null, "image_url": null, "note": null}, {"term": "moral", "translation": "the lesson or message of a story", "audio_url": null, "image_url": null, "note": null}, {"term": "fable", "translation": "a short story with a moral", "audio_url": null, "image_url": null, "note": null}, {"term": "valuable", "translation": "having high worth (synonym of precious)", "audio_url": null, "image_url": null, "note": null}], "mode": "pairs"};

  let mode = CONFIG.mode || "pairs";

  function shuffle(a) { return a.map(v => [Math.random(), v]).sort((p, q) => p[0] - q[0]).map(p => p[1]); }

  function audioBtn(url) {
    if (!url) return "";
    return `<span class="play-btn" data-audio="${url}">▶︎ play</span>`;
  }

  // ---------- Pairs mode -----------------------------------------------
  const colTerms = document.getElementById("col-terms");
  const colTrans = document.getElementById("col-translations");
  const lines = document.getElementById("lines");
  let selected = null; // { idx, side }
  const matched = new Set();

  function buildPairs() {
    selected = null; matched.clear();
    colTerms.innerHTML = ""; colTrans.innerHTML = "";
    lines.innerHTML = "";
    document.getElementById("score").textContent = "";
    document.getElementById("score").className = "";
    // Independent shuffles so the two columns don't line up.
    const left = shuffle(CONFIG.cards.map((_, i) => i));
    const right = shuffle(CONFIG.cards.map((_, i) => i));
    left.forEach((i) => colTerms.appendChild(makeCard(i, "term")));
    right.forEach((i) => colTrans.appendChild(makeCard(i, "trans")));
  }

  function makeCard(idx, side) {
    const el = document.createElement("div");
    el.className = "pcard";
    el.dataset.idx = String(idx);
    el.dataset.side = side;
    const card = CONFIG.cards[idx];
    if (side === "term") {
      el.innerHTML = `<span></span> ${audioBtn(card.audio_url)}`;
      el.querySelector("span").textContent = card.term;
    } else {
      el.innerHTML = `<span></span>`;
      el.querySelector("span").textContent = card.translation;
      if (card.image_url) {
        const img = document.createElement("img"); img.src = card.image_url; img.style.maxHeight = "40px"; img.style.borderRadius = "6px"; img.style.marginLeft = "8px"; img.style.verticalAlign = "middle";
        el.appendChild(img);
      }
    }
    el.addEventListener("click", (e) => {
      if (e.target.classList.contains("play-btn")) {
        const url = e.target.dataset.audio;
        if (url) new Audio(url).play().catch(() => {});
        e.stopPropagation(); return;
      }
      onPickPair(el, idx, side);
    });
    return el;
  }

  function onPickPair(el, idx, side) {
    if (matched.has(idx)) return;
    if (!selected) {
      selected = { el, idx, side };
      el.classList.add("selected");
      return;
    }
    if (selected.side === side) {
      // Switching the selection to a same-side card.
      selected.el.classList.remove("selected");
      selected = { el, idx, side };
      el.classList.add("selected");
      return;
    }
    // We have a term + translation pair selected.
    if (selected.idx === idx) {
      el.classList.add("matched"); selected.el.classList.add("matched");
      drawMatchLine(selected.el, el);
      matched.add(idx);
      selected.el.classList.remove("selected");
      selected = null;
      maybeFinish();
    } else {
      el.classList.add("bad"); selected.el.classList.add("bad");
      const a = selected.el, b = el;
      setTimeout(() => { a.classList.remove("bad", "selected"); b.classList.remove("bad"); }, 800);
      selected = null;
    }
  }

  function drawMatchLine(a, b) {
    const wrap = document.getElementById("pairs-wrap").getBoundingClientRect();
    const ra = a.getBoundingClientRect(); const rb = b.getBoundingClientRect();
    const x1 = ra.right - wrap.left, y1 = ra.top + ra.height/2 - wrap.top;
    const x2 = rb.left - wrap.left,  y2 = rb.top + rb.height/2 - wrap.top;
    const ns = "http://www.w3.org/2000/svg";
    const line = document.createElementNS(ns, "line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y1); line.setAttribute("x2", x2); line.setAttribute("y2", y2);
    line.setAttribute("stroke", "#f472b6"); line.setAttribute("stroke-width", "2"); line.setAttribute("opacity", "0.7");
    lines.appendChild(line);
  }

  function maybeFinish() {
    const total = CONFIG.cards.length;
    if (matched.size === total) {
      const s = document.getElementById("score");
      s.textContent = `All ${total} pairs matched 🎉`;
      s.className = "ok";
    }
  }

  // ---------- Memory mode ----------------------------------------------
  const memBoard = document.getElementById("memory-board");
  let openCards = []; // currently flipped (max 2)
  let memMatched = 0;

  function buildMemory() {
    memBoard.innerHTML = "";
    openCards = []; memMatched = 0;
    document.getElementById("score").textContent = "";
    document.getElementById("score").className = "";
    const cards = [];
    CONFIG.cards.forEach((card, i) => {
      cards.push({ pair: i, kind: "term", value: card.term });
      cards.push({ pair: i, kind: "trans", value: card.translation, image: card.image_url });
    });
    shuffle(cards).forEach((c) => memBoard.appendChild(makeMemCard(c)));
  }

  function makeMemCard(c) {
    const el = document.createElement("div");
    el.className = "mcard";
    el.dataset.pair = String(c.pair);
    const back = c.image ? `<img class="thumb" src="${c.image}" alt="" />` : `<span></span>`;
    el.innerHTML = `<div class="face"><div class="front">?</div><div class="back">${back}</div></div>`;
    if (!c.image) el.querySelector(".back span").textContent = c.value; else { /* image already in back */ }
    el.addEventListener("click", () => onPickMem(el));
    return el;
  }

  function onPickMem(el) {
    if (el.classList.contains("flipped") || el.classList.contains("matched")) return;
    if (openCards.length === 2) return;
    el.classList.add("flipped");
    openCards.push(el);
    if (openCards.length === 2) {
      const [a, b] = openCards;
      if (a.dataset.pair === b.dataset.pair) {
        a.classList.add("matched"); b.classList.add("matched");
        memMatched++; openCards = [];
        if (memMatched === CONFIG.cards.length) {
          const s = document.getElementById("score");
          s.textContent = `Cleared all ${memMatched} pairs 🎉`;
          s.className = "ok";
        }
      } else {
        a.classList.add("bad"); b.classList.add("bad");
        setTimeout(() => {
          a.classList.remove("flipped", "bad"); b.classList.remove("flipped", "bad");
          openCards = [];
        }, 800);
      }
    }
  }

  // ---------- Mode switching --------------------------------------------
  function switchMode(m) {
    mode = m;
    document.getElementById("m-pairs").classList.toggle("active", m === "pairs");
    document.getElementById("m-memory").classList.toggle("active", m === "memory");
    document.getElementById("pairs-wrap").style.display = m === "pairs" ? "" : "none";
    memBoard.style.display = m === "memory" ? "grid" : "none";
    if (m === "pairs") buildPairs(); else buildMemory();
  }
  document.getElementById("m-pairs").addEventListener("click", () => switchMode("pairs"));
  document.getElementById("m-memory").addEventListener("click", () => switchMode("memory"));
  document.getElementById("reset").addEventListener("click", () => switchMode(mode));
  switchMode(mode);
</script>
</body>
</html>
