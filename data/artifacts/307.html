<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>प्रत्येक शब्द/भाव को सही विवरण से मिलाएँ</title>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0; --accent:#2563eb; --ok:#16a34a; --err:#dc2626; --muted:#64748b; }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #0f172a; margin: 0; padding: 24px; }
    header { max-width: 960px; margin: 0 auto 24px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p.instructions { color: var(--muted); margin: 0; }
    main { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .col h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px; }
    .card { background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
    .card:hover { border-color: var(--accent); }
    .card.selected { border-color: var(--accent); background: #eff6ff; }
    .card.ok { border-color: var(--ok); background: #f0fdf4; cursor: default; }
    .card.err { border-color: var(--err); background: #fef2f2; }
    .card.done { opacity: .55; cursor: default; }
    footer { max-width: 960px; margin: 20px auto 0; display:flex; justify-content: space-between; align-items: center; color: var(--muted); }
    button { background: var(--accent); color: white; border: 0; padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>प्रत्येक शब्द/भाव को सही विवरण से मिलाएँ</h1>
    <p class="instructions">बायाँ ओर के शब्द को दायीं ओर के सही विवरण से मिलाएँ। पात्र, प्रतीक, अलंकार और शब्दार्थ शामिल हैं।</p>
  </header>
  <main>
    <div class="col">
      <h2>Terms</h2>
      <div id="terms"></div>
    </div>
    <div class="col">
      <h2>Match</h2>
      <div id="matches"></div>
    </div>
  </main>
  <footer>
    <span id="score">Score: 0 / <span id="total">0</span></span>
    <button id="reset" type="button">Reset</button>
  </footer>
  <script>
    const PAIRS = [{"term": "\u0938\u0942\u0930\u0926\u093e\u0938", "match": "\u092d\u0915\u094d\u0924\u093f\u0915\u093e\u0932 \u0915\u0947 \u0938\u0917\u0941\u0923 \u092d\u0915\u094d\u0924\u093f \u0927\u093e\u0930\u093e \u0915\u0947 \u0938\u0930\u094d\u0935\u0936\u094d\u0930\u0947\u0937\u094d\u0920 \u0915\u0935\u093f"}, {"term": "\u0938\u0942\u0930\u0938\u093e\u0917\u0930", "match": "\u0938\u0942\u0930\u0926\u093e\u0938 \u0915\u0940 \u092a\u094d\u0930\u092e\u0941\u0916 \u0930\u091a\u0928\u093e; \u0932\u0917\u092d\u0917 \u090f\u0915 \u0932\u093e\u0916 \u092a\u0926"}, {"term": "\u092c\u094d\u0930\u091c\u092d\u093e\u0937\u093e", "match": "\u0935\u094d\u0930\u091c \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0940 \u092e\u0927\u0941\u0930 \u092c\u094b\u0932\u0940; \u0938\u0942\u0930\u0926\u093e\u0938 \u0915\u0940 \u0915\u093e\u0935\u094d\u092f-\u092d\u093e\u0937\u093e"}, {"term": "\u0905\u0937\u094d\u091f\u091b\u093e\u092a", "match": "\u0935\u093f\u091f\u094d\u0920\u0932\u0928\u093e\u0925 \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0906\u0920 \u0915\u0935\u093f\u092f\u094b\u0902 \u0915\u093e \u0938\u092e\u0942\u0939"}, {"term": "\u092d\u094d\u0930\u092e\u0930\u0917\u0940\u0924", "match": "\u0909\u0926\u094d\u0927\u0935-\u0917\u094b\u092a\u0940 \u0938\u0902\u0935\u093e\u0926; \u092d\u094c\u0902\u0930\u0947 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0909\u0924\u094d\u0924\u0930"}, {"term": "\u0909\u0926\u094d\u0927\u0935 (\u090a\u0927\u094b)", "match": "\u0936\u094d\u0930\u0940\u0915\u0943\u0937\u094d\u0923 \u0915\u0947 \u0938\u0916\u093e; \u0928\u093f\u0930\u094d\u0917\u0941\u0923 \u092c\u094d\u0930\u0939\u094d\u092e \u0915\u0947 \u0909\u092a\u0926\u0947\u0936\u0915"}, {"term": "\u092c\u0921\u093c\u092d\u093e\u0917\u0940", "match": "\u0935\u094d\u092f\u0902\u0917\u094d\u092f\u092a\u0942\u0930\u094d\u0923 \u0915\u0925\u0928; \u0909\u0926\u094d\u0927\u0935 \u0915\u0940 \u0928\u093f\u0930\u094d\u0932\u093f\u092a\u094d\u0924\u0924\u093e \u092a\u0930"}, {"term": "\u092a\u0941\u0930\u0907\u0928-\u092a\u093e\u0924", "match": "\u0915\u092e\u0932 \u0915\u093e \u092a\u0924\u094d\u0924\u093e; \u0928\u093f\u0930\u094d\u0932\u093f\u092a\u094d\u0924\u0924\u093e \u0915\u093e \u092a\u094d\u0930\u0924\u0940\u0915"}, {"term": "\u0939\u093e\u0930\u093f\u0932 \u0915\u0940 \u0932\u0915\u0930\u0940", "match": "\u090f\u0915\u0928\u093f\u0937\u094d\u0920 \u0938\u092e\u0930\u094d\u092a\u0923 \u0915\u093e \u092a\u094d\u0930\u0924\u0940\u0915; \u092a\u0902\u091c\u094b\u0902 \u092e\u0947\u0902 \u0932\u0915\u0921\u093c\u0940 \u092a\u0915\u0921\u093c\u0947 \u092a\u0915\u094d\u0937\u0940"}, {"term": "\u0930\u093e\u091c\u0928\u0940\u0924\u093f \u092a\u0922\u093c\u093f \u0906\u090f", "match": "\u0915\u0943\u0937\u094d\u0923-\u0930\u093e\u091c\u0928\u0940\u0924\u093f \u0915\u093e \u0935\u094d\u092f\u0902\u0917\u094d\u092f\u093e\u0924\u094d\u092e\u0915 \u092a\u094d\u0930\u092f\u094b\u0917"}, {"term": "\u0935\u093f\u092f\u094b\u0917-\u0936\u0943\u0902\u0917\u093e\u0930", "match": "\u092d\u094d\u0930\u092e\u0930\u0917\u0940\u0924 \u0915\u0947 \u092a\u0926\u094b\u0902 \u0915\u093e \u092e\u0941\u0916\u094d\u092f \u0930\u0938"}, {"term": "\u0909\u092a\u092e\u093e \u0905\u0932\u0902\u0915\u093e\u0930", "match": "\u0915\u092e\u0932-\u092a\u0924\u094d\u0930, \u0939\u093e\u0930\u093f\u0932 \u0915\u0940 \u0932\u0915\u0930\u0940 \u091c\u0948\u0938\u0947 \u092a\u094d\u0930\u092f\u094b\u0917\u094b\u0902 \u092e\u0947\u0902"}, {"term": "\u0905\u0928\u0941\u092a\u094d\u0930\u093e\u0938 \u0905\u0932\u0902\u0915\u093e\u0930", "match": "\u092e\u0927\u0941\u0930 \u092e\u0927\u0941\u0930, \u0927\u0930\u093f \u0927\u0930\u093f \u091c\u0948\u0938\u0947 \u092a\u094d\u0930\u092f\u094b\u0917\u094b\u0902 \u092e\u0947\u0902"}, {"term": "\u092c\u094d\u092f\u093e\u0927\u093f", "match": "\u0930\u094b\u0917, \u092c\u0940\u092e\u093e\u0930\u0940"}, {"term": "\u092a\u093e\u0939\u0928", "match": "\u092a\u0924\u094d\u0925\u0930; \u092a\u093e\u0937\u093e\u0923"}, {"term": "\u0909\u0930 \u0905\u0902\u0924\u0930\u0917\u0924", "match": "\u0939\u0943\u0926\u092f \u0915\u0947 \u0905\u0902\u0926\u0930"}];
    const termsEl = document.getElementById("terms");
    const matchesEl = document.getElementById("matches");
    const scoreEl = document.getElementById("score");
    document.getElementById("total").textContent = PAIRS.length;

    function shuffle(arr) { return arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]); }

    let selectedTerm = null;
    let correct = 0;

    function render() {
      termsEl.innerHTML = "";
      matchesEl.innerHTML = "";
      selectedTerm = null;
      correct = 0;
      scoreEl.firstChild.textContent = `Score: 0 / `;

      PAIRS.forEach((p, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.textContent = p.term;
        card.dataset.index = index;
        card.addEventListener("click", () => onTermClick(card, index));
        termsEl.appendChild(card);
      });
      shuffle(PAIRS.map((p, i) => ({ text: p.match, index: i }))).forEach(m => {
        const card = document.createElement("div");
        card.className = "card";
        card.textContent = m.text;
        card.dataset.index = m.index;
        card.addEventListener("click", () => onMatchClick(card, m.index));
        matchesEl.appendChild(card);
      });
    }

    function onTermClick(card, index) {
      if (card.classList.contains("done")) return;
      termsEl.querySelectorAll(".card.selected").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
      selectedTerm = { el: card, index };
    }

    function onMatchClick(card, index) {
      if (card.classList.contains("done") || !selectedTerm) return;
      if (selectedTerm.index === index) {
        selectedTerm.el.classList.add("ok", "done");
        selectedTerm.el.classList.remove("selected");
        card.classList.add("ok", "done");
        correct += 1;
        scoreEl.firstChild.textContent = `Score: ${correct} / `;
        selectedTerm = null;
      } else {
        card.classList.add("err");
        setTimeout(() => card.classList.remove("err"), 500);
      }
    }

    document.getElementById("reset").addEventListener("click", render);
    render();
  </script>
</body>
</html>
