<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Webfonts. We load TWO families:
        - Inter — body. Already declared as the first entry in --font-sans;
          actually loading it (vs. relying on system defaults) makes the
          body sit consistent across Windows / macOS / Linux.
        - Plus Jakarta Sans — display. Used for h1/h2/h3 and CardTitle via
          --font-display. Friendly geometric sans that adds personality to
          page heros without making the app look childish.

      `display=swap` shows fallback text immediately and swaps in when the
      webfont loads — slight FOUT (flash of unstyled text) but no FOIT
      (invisible text). Better UX on slow connections.

      `preconnect` to fonts.gstatic.com warms up the TLS / DNS so the
      stylesheet request after it doesn't pay full RTT cost.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Dhananjaya — Practice. Master. Conquer.</title>
    <meta name="description" content="Dhananjaya — a continuous-practice learning platform where every quiz is another arrow drawn toward mastery." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
