<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <!--
    Dhananjaya favicon. Mirrors the BrandLogo composition exactly so the
    browser tab and the in-app sidebar logo look like the same mark.
    Single chunky-arrow polygon reused three times at increasing scale
    in a stair-step formation, tilted 12 degrees to suggest motion.
  -->
  <defs>
    <path id="dh-arrow" d="M 50 5 L 90 50 L 65 50 L 65 95 L 35 95 L 35 50 L 10 50 Z" />
  </defs>
  <g transform="rotate(12 50 50)">
    <use href="#dh-arrow" transform="translate(0 58) scale(0.32)" fill="#F36C21" />
    <use href="#dh-arrow" transform="translate(22 28) scale(0.46)" fill="#3AB54A" />
    <use href="#dh-arrow" transform="translate(38 -3) scale(0.62)" fill="#0E2A4D" />
  </g>
</svg>
