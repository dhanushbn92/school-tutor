<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <!--
    Dhananjaya favicon. Mirrors the BrandLogo composition exactly so the
    browser tab and the in-app sidebar logo look like the same mark.
    Six L-bend arrows in flock formation, tilted 22 degrees so the
    arrows lean into their direction of travel — the visual cue that
    reads as "effort" rather than "frozen".
  -->
  <defs>
    <path id="dh-arrow" d="M 10 75 L 50 75 L 50 25 L 30 25 L 60 5 L 90 25 L 70 25 L 70 90 L 10 90 Z" />
  </defs>
  <g transform="rotate(22 50 50)">
    <use href="#dh-arrow" transform="translate(28 -6) scale(0.66)" fill="#0E2A4D" />
    <use href="#dh-arrow" transform="translate(8 30) scale(0.48)" fill="#3AB54A" />
    <use href="#dh-arrow" transform="translate(-6 8) scale(0.34)" fill="#F36C21" />
    <use href="#dh-arrow" transform="translate(50 48) scale(0.30)" fill="#A04CC9" />
    <use href="#dh-arrow" transform="translate(0 55) scale(0.24)" fill="#7FA9A4" />
    <use href="#dh-arrow" transform="translate(58 0) scale(0.16)" fill="#F7DD2A" />
  </g>
</svg>
