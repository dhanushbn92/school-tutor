<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__</title>
<style>
  :root { --bg:#0b1020; --panel:rgba(15,20,35,0.88); --border:rgba(255,255,255,0.12); --text:#e8ecf5; --muted:#9aa3b2; --accent:#fbbf24; --wire:#cdd5e2; --comp:#fbbf24; --bulb:#fde047; }
  html,body { margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:20px; box-sizing:border-box; display:grid; grid-template-columns: 1fr 320px; gap:18px; align-items:start; }
  header { grid-column:1 / 3; max-width:1200px; }
  h1 { margin:0; font-size:20px; font-weight:600; }
  p.sub { margin:4px 0 0; font-size:13px; color:var(--muted); line-height:1.5; }
  #canvas { background:#0a0e1a; border:1px solid var(--border); border-radius:14px; padding:8px; }
  svg { width:100%; height:auto; aspect-ratio: 5 / 3; display:block; }
  .wire { stroke:var(--wire); stroke-width:2; fill:none; opacity:0.7; }
  .comp-box { fill:none; stroke:var(--comp); stroke-width:2.5; }
  .comp-fill { fill:rgba(251,191,36,0.12); }
  .label { fill:#dbe1ec; font-size:13px; font-family:"JetBrains Mono",ui-monospace,Consolas,monospace; }
  .value { fill:var(--accent); font-size:11px; font-family:"JetBrains Mono",ui-monospace,Consolas,monospace; }
  .glow { filter: drop-shadow(0 0 6px rgba(253,224,71,0.55)); }
  #side { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  #side h2 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); }
  #desc { font-size:13px; color:#dbe1ec; line-height:1.5; }
  #readout { margin-top:14px; padding:10px; background:rgba(251,191,36,0.08); border-left:3px solid var(--accent); border-radius:6px; font-size:13px; }
  #readout div { display:flex; justify-content:space-between; margin:4px 0; }
  #readout .k { color:var(--muted); }
  #readout .v { color:var(--accent); font-variant-numeric:tabular-nums; }
  #components { margin-top:14px; }
  .row { display:grid; grid-template-columns: 1fr auto; gap:6px; align-items:center; font-size:12px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
  .row .nm { color:#cdd5e2; font-family:"JetBrains Mono",ui-monospace,Consolas,monospace; }
  .row .vl { color:var(--accent); }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <p class="sub">__INSTRUCTIONS__</p>
</header>

<div id="canvas">
  <svg id="svg" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<aside id="side">
  <h2>About this circuit</h2>
  <div id="desc"></div>
  <div id="readout"></div>
  <h2 style="margin-top:14px">Components</h2>
  <div id="components"></div>
</aside>

<script>
  // CONFIG = { description, analysis, components: [...], wires: [...] }
  const CONFIG = __CIRCUIT_JSON__;
  document.getElementById("desc").textContent = CONFIG.description || "";

  const svg = document.getElementById("svg");
  const W = 800, H = 480;          // viewBox dims
  const CELL_X = W / 40;            // 20 px per grid cell horizontally (40 cells)
  const CELL_Y = H / 24;             // 20 px per grid cell vertically  (24 cells)

  function gx(x) { return x * CELL_X; }
  function gy(y) { return y * CELL_Y; }

  // Build a name -> component lookup so wires can find endpoints.
  const compMap = new Map();
  (CONFIG.components || []).forEach(c => compMap.set(c.name, c));

  // --- Draw wires (back layer) ----------------------------------------
  (CONFIG.wires || []).forEach(w => {
    const a = compMap.get(w.from_component); const b = compMap.get(w.to_component);
    if (!a || !b) return;
    // L-shape: horizontal first, then vertical.
    const x1 = gx(a.x), y1 = gy(a.y), x2 = gx(b.x), y2 = gy(b.y);
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("class", "wire");
    path.setAttribute("d", `M ${x1} ${y1} L ${x2} ${y1} L ${x2} ${y2}`);
    svg.appendChild(path);
  });

  // --- Draw each component --------------------------------------------
  function group(rotation) {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    if (rotation) g.setAttribute("transform", `rotate(${rotation})`);
    return g;
  }
  function add(g, tag, attrs) {
    const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    g.appendChild(e);
    return e;
  }

  function drawComponent(c) {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("transform", `translate(${gx(c.x)}, ${gy(c.y)}) rotate(${c.rotation || 0})`);
    const labelOffsetY = 30;
    let unit = c.unit;

    if (c.kind === "battery") {
      // Symbol: two parallel lines (long = +, short = -)
      add(g, "line", { x1:-12, y1:-12, x2:-12, y2:12, stroke:"var(--comp)", "stroke-width":3 });
      add(g, "line", { x1: 6, y1:-7,  x2: 6, y2:7,  stroke:"var(--comp)", "stroke-width":3 });
      add(g, "line", { x1:-12, y1:0, x2:-30, y2:0, stroke:"var(--comp)", "stroke-width":2 });
      add(g, "line", { x1: 6, y1:0, x2: 24, y2:0, stroke:"var(--comp)", "stroke-width":2 });
      unit = unit || "V";
    } else if (c.kind === "resistor") {
      // Zig-zag.
      const path = "M -25 0 L -18 0 L -14 -7 L -6 7 L 2 -7 L 10 7 L 14 0 L 25 0";
      add(g, "path", { d: path, "class":"comp-box", fill:"none" });
      unit = unit || "Ω";
    } else if (c.kind === "bulb") {
      // Circle with X inside.
      add(g, "circle", { cx:0, cy:0, r:14, "class":"comp-box glow", fill:"rgba(253,224,71,0.18)" });
      add(g, "line", { x1:-10, y1:-10, x2:10, y2:10, stroke:"var(--bulb)", "stroke-width":2 });
      add(g, "line", { x1:-10, y1:10, x2:10, y2:-10, stroke:"var(--bulb)", "stroke-width":2 });
      add(g, "line", { x1:-25, y1:0, x2:-14, y2:0, stroke:"var(--comp)", "stroke-width":2 });
      add(g, "line", { x1: 14, y1:0, x2: 25, y2:0, stroke:"var(--comp)", "stroke-width":2 });
      unit = unit || "Ω";
    } else if (c.kind === "switch") {
      add(g, "line", { x1:-25, y1:0, x2:-14, y2:0, stroke:"var(--comp)", "stroke-width":2 });
      add(g, "line", { x1: 14, y1:0, x2: 25, y2:0, stroke:"var(--comp)", "stroke-width":2 });
      add(g, "line", { x1:-14, y1:0, x2: 8, y2:-12, stroke:"var(--comp)", "stroke-width":2 });
      add(g, "circle", { cx:-14, cy:0, r:2, fill:"var(--comp)" });
      add(g, "circle", { cx: 14, cy:0, r:2, fill:"var(--comp)" });
      unit = unit || "";
    } else if (c.kind === "capacitor") {
      add(g, "line", { x1:-4, y1:-12, x2:-4, y2:12, stroke:"var(--comp)", "stroke-width":3 });
      add(g, "line", { x1: 4, y1:-12, x2: 4, y2:12, stroke:"var(--comp)", "stroke-width":3 });
      add(g, "line", { x1:-25, y1:0, x2:-4, y2:0, stroke:"var(--comp)", "stroke-width":2 });
      add(g, "line", { x1: 4, y1:0, x2: 25, y2:0, stroke:"var(--comp)", "stroke-width":2 });
      unit = unit || "F";
    } else if (c.kind === "ammeter") {
      add(g, "circle", { cx:0, cy:0, r:14, "class":"comp-box", fill:"rgba(251,191,36,0.10)" });
      add(g, "text", { x:0, y:5, "text-anchor":"middle", fill:"var(--comp)", "font-size":14, "font-family":"sans-serif" }).textContent = "A";
      add(g, "line", { x1:-25, y1:0, x2:-14, y2:0, stroke:"var(--comp)", "stroke-width":2 });
      add(g, "line", { x1: 14, y1:0, x2: 25, y2:0, stroke:"var(--comp)", "stroke-width":2 });
      unit = unit || "A";
    } else if (c.kind === "voltmeter") {
      add(g, "circle", { cx:0, cy:0, r:14, "class":"comp-box", fill:"rgba(251,191,36,0.10)" });
      add(g, "text", { x:0, y:5, "text-anchor":"middle", fill:"var(--comp)", "font-size":14, "font-family":"sans-serif" }).textContent = "V";
      add(g, "line", { x1:-25, y1:0, x2:-14, y2:0, stroke:"var(--comp)", "stroke-width":2 });
      add(g, "line", { x1: 14, y1:0, x2: 25, y2:0, stroke:"var(--comp)", "stroke-width":2 });
      unit = unit || "V";
    } else if (c.kind === "junction") {
      add(g, "circle", { cx:0, cy:0, r:3.5, fill:"var(--wire)" });
    }

    // Name + value labels (horizontal, ignore rotation)
    const nameLabel = document.createElementNS("http://www.w3.org/2000/svg", "g");
    nameLabel.setAttribute("transform", `translate(${gx(c.x)}, ${gy(c.y)})`);
    if (c.kind !== "junction") {
      const t1 = add(nameLabel, "text", { x:0, y:-22, "text-anchor":"middle", "class":"label" });
      t1.textContent = c.name;
      if (c.value !== null && c.value !== undefined) {
        const t2 = add(nameLabel, "text", { x:0, y: 32, "text-anchor":"middle", "class":"value" });
        t2.textContent = `${c.value}${unit ? ' ' + unit : ''}`;
      }
    }
    svg.appendChild(g);
    svg.appendChild(nameLabel);
  }

  (CONFIG.components || []).forEach(drawComponent);

  // --- Side panel: components list + analysis ----------------------------
  const compList = document.getElementById("components");
  (CONFIG.components || []).forEach(c => {
    if (c.kind === "junction" || c.kind === "switch") return;
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<span class="nm"></span><span class="vl"></span>`;
    row.querySelector(".nm").textContent = `${c.name} · ${c.kind}`;
    if (c.value !== null && c.value !== undefined) row.querySelector(".vl").textContent = `${c.value} ${c.unit || ''}`;
    compList.appendChild(row);
  });

  // --- Analysis: series / parallel resistor totals + battery current -----
  const ro = document.getElementById("readout");
  const battery = (CONFIG.components || []).find(c => c.kind === "battery");
  const resistors = (CONFIG.components || []).filter(c => c.kind === "resistor" || c.kind === "bulb");
  const voltage = battery && typeof battery.value === "number" ? battery.value : null;

  let totalR = null, current = null;
  if (CONFIG.analysis === "series" && resistors.length) {
    totalR = resistors.reduce((sum, r) => sum + (r.value || 0), 0);
  } else if (CONFIG.analysis === "parallel" && resistors.length) {
    const inv = resistors.reduce((s, r) => s + (r.value > 0 ? 1 / r.value : 0), 0);
    totalR = inv > 0 ? 1 / inv : null;
  }
  if (totalR !== null && voltage !== null && totalR > 0) {
    current = voltage / totalR;
  }

  const lines = [];
  if (voltage !== null) lines.push(`<div><span class="k">Source voltage</span><span class="v">${voltage} V</span></div>`);
  if (totalR !== null) lines.push(`<div><span class="k">Total resistance (${CONFIG.analysis})</span><span class="v">${totalR.toFixed(2)} Ω</span></div>`);
  if (current !== null) lines.push(`<div><span class="k">Current (Ohm's law)</span><span class="v">${current.toFixed(3)} A</span></div>`);
  if (CONFIG.analysis === "series" && resistors.length && current !== null) {
    resistors.forEach(r => {
      lines.push(`<div><span class="k">V across ${r.name}</span><span class="v">${(current * (r.value || 0)).toFixed(2)} V</span></div>`);
    });
  } else if (CONFIG.analysis === "parallel" && resistors.length && voltage !== null) {
    resistors.forEach(r => {
      const i = r.value > 0 ? voltage / r.value : 0;
      lines.push(`<div><span class="k">Current through ${r.name}</span><span class="v">${i.toFixed(3)} A</span></div>`);
    });
  }
  ro.innerHTML = lines.join("") || `<div><span class="k">Analysis</span><span class="v">none — visual only</span></div>`;
</script>
</body>
</html>
